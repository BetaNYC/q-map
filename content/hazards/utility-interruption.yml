# Utility Interruption
# Authored content: the pipeline validates and copies it to
# data/processed/hazards/utility-interruption.json.
#
# From the SME partners' final "Core Readiness Messages by Threat"
# (test/Core Readiness Messages by Threat.pdf, delivered 2026-10-26), using
# the mapping documented in flooding.yml. Split from Cyberattack, with which
# it shared a page before.
#
# The 911 line is a statement, not a question, so it is one NOTE with no body.
#
# Con Edison only. This is the page for the thirteen districts that Con Edison
# alone serves. The Rockaways (Q14) has two electric utilities - PSEG Long
# Island on the peninsula, Con Edison in Broad Channel - and reads
# utility-interruption/q14.yml instead. That override restates every section,
# so an edit to core-actions or to the citywide response items here must be
# repeated there.

slug: utility-interruption
label: Utility Interruption
jra_category: utility-interruption

summary: >
  A utility interruption is a broad term for any temporary loss or disruption
  to essential services, including electricity, gas, water, heat, or phone
  and internet service. A blackout is a specific, severe type of electrical
  interruption.

sections:
  - id: core-actions
    title: Core actions
    items:
      - label: Keep flashlights, charged batteries, and written contacts ready
        note: true
        body: If you use powered medical equipment, make a backup plan.
      - label: Report lost power to your electric utility
        note: true
        body: >
          Keep fridge doors closed. Never run a generator indoors or use a
          stove for heat.
      - label: >
          If essential medical equipment stops or you are in immediate
          danger, call 911
        note: true

  - id: preparedness
    title: Get Ready
    items:
      - label: Register powered medical equipment with Con Edison
        link_label: Con Edison
        url: https://www.coned.com/en/accounts-billing/payment-plans-assistance/special-services
        body: >
          Life-support equipment and special customer protections.
          Registration does not guarantee uninterrupted power or immediate
          restoration.

  - id: response
    title: When Something Happens
    items:
      - label: Report or track a Con Edison outage
        link_label: Con Edison
        url: https://www.coned.com/en/services-and-outages/report-track-service-issue
        body: Outages in most of Queens. Report online or call 800-752-6633.
      - label: Stay safe when utilities stop working
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/utility-disruptions.page
        body: Electricity, gas, water, and telephone disruptions.
      - label: Check food safety after a power outage
        link_label: NYC Health
        url: https://www.nyc.gov/site/doh/health/emergency-preparedness/emergencies-power-outage.page
        body: Food, medication, and other health precautions when power is lost.
      - label: Find an air-conditioned place nearby
        link_label: NYC Cool Options
        url: https://finder.nyc.gov/coolingcenters/locations
        body: >
          Cooling centers and other places to cool down. Check activation,
          hours, accessibility, and any entry costs.
      - label: Request help for someone living outside
        link_label: NYC311
        url: https://portal.311.nyc.gov/article/?kanumber=KA-01037
        body: >
          Homeless outreach and Code Blue information. Call 911 for immediate
          medical danger.

map_layers: []
