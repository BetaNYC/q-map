# Extreme Heat — Example for the hazard content schema.

slug: extreme-heat
label: Extreme Heat
jra_category: temperature-extremes

summary: >
  Heat is the deadliest weather hazard in New York City. Most heat deaths happen
  indoors, in homes without air conditioning. Risk is highest for older adults,
  people with chronic illness, and people living alone.

sections:
  - id: preparedness
    title: Before a heat wave
    items:
      - label: Get prepared for emergencies in NYC
        url: https://www.nyc.gov/site/em/ready/get-prepared.page
      - label: Beat the heat — NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/extreme-heat.page
      - label: Help paying your energy bill
        url: https://www.nyc.gov/site/hra/help/energy-assistance.page

  - id: response
    title: During a heat wave
    items:
      - label: Find a cooling center near you
        url: https://finder.nyc.gov/coolingcenters
      - label: Check the current heat advisory
        url: https://www.weather.gov/okx/

  - id: utility-interruptions
    title: Report utility interruptions immediately
    items:
      - label: Con Edison
        tel: "1-800-752-6633"
        tty: "1-800-642-2308"
      - label: National Grid
        tel: "1-718-643-4050"
        tty: "1-718-297-2857"
      - label: PSEG Long Island
        tel: "1-800-490-0025"
        tty: "1-631-755-6660"

  - id: general
    title: General information
    items:
      - label: Heat Vulnerability Index — Environment & Health Data Portal
        url: https://a816-dohbesp.nyc.gov/IndicatorPublic/key-topics/climatehealth/hvi/
      - label: Climate and health data explorer
        url: https://a816-dohbesp.nyc.gov/IndicatorPublic/data-explorer/climate/
      - label: Beat the Heat NYC
        url: https://www.nyc.gov/assets/em/html/beat-the-heat/beattheheat.html

  - id: signs-of-heat-illness
    title: Signs of heat illness
    body: >
      Call 911 immediately for hot dry skin, confusion, fainting, or a
      temperature above 103°F. Heat exhaustion — heavy sweating, weakness,
      nausea, headache — can become heat stroke quickly. Move to a cool place
      and drink water.

  - id: prevention
    title: Staying safe indoors
    body: >
      Use air conditioning if you have it, even briefly. A fan alone is not
      enough above about 95°F. Check on neighbours who live alone, are older,
      or have a chronic illness.

