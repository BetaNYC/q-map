# Extreme Heat
# Authored content: the pipeline validates and copies content below
#
# Rewritten 2026-10-14 from the SME-reviewed "Core Readiness Messages by
# Threat" (test/Core Readiness Messages by Threat.pdf, reviewed 8 October
# 2026), using the mapping documented in heavy-rain.yml. Its "Suggested first
# links" are "Start here"; its "Additional candidate links" are "More help".

slug: extreme-heat
label: Extreme Heat
jra_category: temperature-extremes

summary: >
  Extreme heat is weather hot enough to strain your body. Humidity can make
  it harder to cool down, even indoors.

sections:
  - id: core-actions
    title: Core actions
    items:
      - label: Use air conditioning or spend time in an air-conditioned place
        note: true
        body: Fans alone may not keep you safe during extreme heat.
      - label: Drink water regularly and take breaks from activity
        note: true
        body: Check on people living alone or without cooling.
      - label: Never leave anyone or a pet in a parked car
        note: true
        body: Plan now for cooling and help with energy costs.
      - label: Confusion, fainting, or trouble breathing in the heat?
        note: true
        body: Call 911 and start cooling the person.

  - id: start-here
    title: Start here
    items:
      - label: Find an air-conditioned place nearby
        link_label: NYC Cool Options
        url: https://finder.nyc.gov/coolingcenters/locations
        body: >
          Cooling centers and other places to cool down. Check
          activation, hours, accessibility, and any entry costs.
      - label: Learn how to stay safe in hot weather
        link_label: NYC Health
        url: https://www.nyc.gov/site/doh/health/emergency-preparedness/emergencies-extreme-weather-heat.page
        body: >
          Indoor cooling, heat illness, and checking on people who
          need support. Translated heat safety materials.
      - label: Check help buying an air conditioner
        link_label: HEAP Cooling Assistance through HRA
        url: https://access.nyc.gov/programs/cooling-assistance-benefit/
        body: >
          Equipment and installation for eligible households.
          Seasonal; 2026 applications are closed.

  - id: more-help
    title: More help
    items:
      - label: Check cooling help for Essential Plan members
        link_label: Essential Plan Cooling Program
        url: https://portal.311.nyc.gov/article/?kanumber=KA-03679
        body: >
          An air conditioner for eligible members with qualifying
          health needs. 2026 applications are closed.
      - label: Ask Con Edison about bill assistance
        link_label: Con Edison
        url: https://www.coned.com/en/accounts-billing/payment-plans-assistance/help-paying-your-bill
        body: Discounts and payment assistance for eligible customers in most of Queens.
      - label: Ask PSEG Long Island about bill assistance
        link_label: PSEG Long Island
        url: https://www.psegliny.com/myaccount/customersupport/financialassistance
        body: Payment and financial assistance for eligible customers in the Rockaways.
      - label: Find outdoor water and shade
        link_label: NYC Parks Cool It NYC
        url: https://portal.311.nyc.gov/article/?kanumber=KA-03323
        body: >
          Spray showers, fountains, and shaded spaces. Air
          conditioning offers stronger protection during extreme heat.
      - label: Find your Queens library
        link_label: Queens Public Library
        url: https://queenslibrary.org/about-us/locations
        body: >
          Local branches, internet access, and community information.
          Check current hours and closures before going.
      - label: Find support for an older adult
        link_label: NYC Aging
        url: https://www.nyc.gov/site/dfta/services/find-help.page
        body: >
          Meals, case management, caregiver help, and local centers.
          Call Aging Connect at 212-244-6469. Phone language
          assistance available.
      - label: Queens Community House older adult support
        link_label: Queens Community House
        url: https://qchnyc.org/programs/older-adult-services
        body: >
          Local centers, case management, and home-delivered meals for
          eligible older adults. Confirm service area and enrollment.
      - label: Learn about time off when you are sick
        link_label: NYC DCWP
        url: https://www.nyc.gov/site/dca/workers/workersrights/paid-sick-leave-law-for-workers.page
        body: >
          Protected time off for covered workers, including illness.
          Check current rules and reporting options. Translated worker
          materials.

