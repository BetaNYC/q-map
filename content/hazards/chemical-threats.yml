# Chemical Threats
# Authored content: the pipeline validates and copies it to
# data/processed/hazards/chemical-threats.json.
#
# From the SME partners' final "Core Readiness Messages by Threat"
# (test/Core Readiness Messages by Threat.pdf, delivered 2026-10-26), using
# the mapping documented in flooding.yml. Split from Hazmat Release, with
# which it shared a page before.
#
# "Call NYC Poison Control" links a NYC311 article; see hazmat.yml.

slug: chemical-threats
label: Chemical Threats
jra_category: chemical-threat

summary: >
  Chemical threats are harmful substances that can be breathed in, swallowed,
  or touched, including household products and chemicals released on
  purpose.

sections:
  - id: core-actions
    title: Core actions
    items:
      - label: Move away from a spill or fumes without entering the affected area
        note: true
        body: Do not touch or try to clean an unknown substance.
      - label: Store household chemicals safely and never mix cleaners
        note: true
        body: Call Poison Control right away after a possible exposure.
      - label: >
          Trouble breathing, collapse, a gas smell, or an active dangerous
          release?
        note: true
        body: Move to safety and call 911.

  - id: preparedness
    title: Get Ready
    items:
      - label: Follow chemical spill safety guidance
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/hazardous-materials-chemical-spills-radiation.page
        body: >
          Moving away, sheltering, and following official instructions during
          a hazardous release.
      - label: Find a safe household waste disposal event
        link_label: NYC Sanitation SAFE events
        url: https://www.nyc.gov/site/dsny/what-we-do/programs/safe-disposal-events.page
        body: >
          Dispose of accepted chemicals and other harmful household products.
          Check dates and residency requirements.
      - label: Find a household special waste drop-off site
        link_label: NYC Sanitation
        url: https://www.nyc.gov/site/dsny/what-we-do/programs/special-waste-drop-off.page
        body: >
          Accepted products, Queens site, and current hours. Routine disposal
          service; not for an active spill.

  - id: response
    title: When Something Happens
    items:
      - label: Call NYC Poison Control
        link_label: NYC311
        url: https://portal.311.nyc.gov/article/?kanumber=KA-01888
        body: >
          Free, confidential advice for a possible exposure. Call
          212-764-7667 immediately; do not wait for symptoms. 24/7 phone
          interpreters in 150 languages.

map_layers: []
