sections:
  - id: preparedness
    title: Preparedness
    items: 
      - label: Know your flooding risk from Flood Help NY
        url: https://www.floodhelpny.org/en
      - label: Build your property's readiness
        items:
          - label: Get personalized flood guidance for your property type and location from Blue Dots
            url: https://bluedots.nyc
          - label: Consider getting flood insurance
            url: https://www.floodsmart.gov/
          - label: Install flood infrastructure
            note: true
      - label: Review NYC Emergency Management's guidelines for before, during, and after flooding.
        url: https://www.nyc.gov/site/em/ready/flooding.page
      - label: See what the City does during a flood
        url: https://www.nyc.gov/site/dep/whats-new/prepare-for-the-storm.page
      - label: Before a flood
        items:
          - label: Make an itemized list of personal property, including furnishings, clothing, and valuables.
            note: true
          - label: Learn the safest route from your home or workplace to safe, high ground in case you have to evacuate. This should be part of your household disaster plan.
            note: true
          - label: If you live in a flood-susceptible area, keep materials, such as sandbags, plywood, plastic sheeting, and lumber, on hand to help protect your home.
            note: true
  - id: response
    title: Response
    items:
      - label: Get realtime information on the flooding level from FloodNet NYC
        url: https://dataviz.floodnet.nyc/
      - label: If you live in a basement apartment, be prepared to move to a higher floor during periods of heavy rain. Be prepared to evacuate if needed.
        note: true
      - label: During a flood
        items:
          - label: Do not use showers, sinks, or any object, machine, or device connected to the building's plumbing system.
            note: true
          - label: Report downed wires to 311 immediately.
            note: true
          - label: Bring outdoor objects, such as lawn furniture, garbage cans and other loose items, inside the house or tie them down securely.
            note: true
          - label: To prepare for a possible power outage, charge cell phone batteries, gather supplies, and turn your refrigerator and freezer to a colder setting. If you lose power, items that need refrigeration will stay cooler for longer.
            note: true
          - label: Check on friends, relatives, and neighbors, especially older adults and people with disabilities, access and functional needs, or health conditions. Help them to prepare if needed.
            note: true

  - id: general
    title: General information

