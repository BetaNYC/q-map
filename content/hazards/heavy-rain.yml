# Heavy Rain
# Authored content: the pipeline validates and copies content below
#
# Rewritten 2026-10-14 from the SME-reviewed "Core Readiness Messages by
# Threat" (test/Core Readiness Messages by Threat.pdf, reviewed 8 October
# 2026). Its mapping to this schema, used by every hazard file:
#
#   intro paragraph          -> summary
#   Core actions (bullets)   -> section `core-actions`, one NOTE per bullet:
#                               the first sentence is the heading (`label`),
#                               the rest is `body`
#   "...? Call 911." line    -> the last NOTE in `core-actions`
#   "Label — Source: text"   -> a LINK: `label` = Label, `link_label` =
#                               Source, `body` = text
#   link group headings      -> sections, as the document titles them:
#                               "Get Ready" is `preparedness`, "When
#                               Something Happens" is `response`. Existing
#                               ids, so a district override still lines up.
#
# Item shape from the Figma screen "03 Hazard - Mobile/Flooding" (node
# 58:403): a short heading in `label`, the destination's own name in
# `link_label`, the detail in `body`.


slug: heavy-rain
label: Heavy Rain
jra_category: flooding

summary: >
  Heavy rain can overwhelm drains and sewers, causing water to rise quickly in
  streets, basements, and other low places.

sections:
  - id: core-actions
    title: Core actions
    items:
      - label: Know where you can go above ground
        note: true
        body: If you live in a basement, move early when flooding is forecast or warned.
      - label: Never walk or drive through floodwater
        note: true
        body: Stay away from downed wires and flooded electrical equipment.
      - label: Keep exits clear and essentials ready
        note: true
        body: Follow local alerts; report damage to 311 after you are safe.
      - label: Trapped by rising water or facing immediate danger?
        note: true
        body: Call 911.

  - id: preparedness
    title: Get Ready
    items:
      - label: Learn what to do before and after flooding
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/flooding.page
        body: Flood safety, basement precautions, and recovery steps.
      - label: Check rainfall flooding risks
        link_label: NYC DEP
        url: https://www.nyc.gov/site/dep/whats-new/plan-for-intense-storms.page
        body: >
          Links to stormwater flood maps and ways to protect your home. Maps are
          planning tools, not live warnings.
      - label: Understand flood insurance and home protection
        link_label: FloodHelpNY
        url: https://www.floodhelpny.org/en
        body: >
          A nonprofit resource: flood risk, separate flood insurance, and home
          improvements. Program eligibility varies. Website in nine languages.
      - label: Explore ways to keep water out
        link_label: Blue Dots
        url: https://bluedots.nyc/
        body: >
          A private NYC platform: property improvements and local providers.
          Work may cost money; compare providers independently.
      - label: Find practical rainfall preparation steps
        link_label: Rainfall Ready NYC
        url: https://www.nyc.gov/site/dep/whats-new/prepare-for-the-storm.page
        body: From DEP. Prepare drains, property, and household plans before intense rain.

  - id: response
    title: When Something Happens
    items:
      - label: See water levels at nearby flood sensors
        link_label: FloodNet NYC
        url: https://dataviz.floodnet.nyc/
        body: >
          Near-real-time readings at sensor locations. Coverage is limited; a
          blank map does not mean a street is safe.
      - label: Clean up safely after a flood
        link_label: NYC Health
        url: https://www.nyc.gov/site/doh/health/emergency-preparedness/emergencies-extreme-weather-coastal-storm.page
        body: Safe cleanup, food and water safety, and steps to reduce mold.
      - label: Get guidance on mold and dampness
        link_label: NYC Health
        url: https://www.nyc.gov/site/doh/health/health-topics/mold.page
        body: >
          Preventing and removing mold. Tenants can report unresolved conditions
          through 311. Translated mold guide.
      - label: Report a sewer backup
        link_label: NYC311
        url: https://portal.311.nyc.gov/article/?kanumber=KA-01510
        body: >
          Report sewage flooding in a building. Call 911 if floodwater creates
          immediate danger.
      - label: Get help if you cannot return home
        link_label: Back Home NYC
        url: https://backhome.nyc.gov/
        body: Help for tenants displaced by emergencies or vacate orders. Call 212-389-6670.

map_layers:
  - stormwater_moderate_2_13
  - stormwater_limited_1_77
