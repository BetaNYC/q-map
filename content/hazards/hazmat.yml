# Hazmat Release
# Authored content: the pipeline validates and copies it to
# data/processed/hazards/hazmat.json.
#
# From the SME partners' final "Core Readiness Messages by Threat"
# (test/Core Readiness Messages by Threat.pdf, delivered 2026-10-26), using
# the mapping documented in flooding.yml. The slug predates the split from
# Chemical Threats and is kept so existing links still resolve.
#
# Copy edits against the PDF, confirmed by Andrew 2026-10-26:
#   - "Know when to leave or stay inside" has no source in the PDF; it is the
#     same NYC Emergency Management page the General page links.
#
# "Call NYC Poison Control" names no source in the PDF. Its link is a NYC311
# article, so `link_label` is NYC311, as for every other 311 link.

slug: hazmat
label: Hazmat Release
jra_category: hazardous-materials-release

summary: >
  Hazmat means hazardous materials. A spill or release of harmful chemicals
  can affect the air, water, or surfaces nearby.

sections:
  - id: core-actions
    title: Core actions
    items:
      - label: Move away from a spill or fumes without entering the affected area
        note: true
        body: Do not touch or try to clean an unknown substance.
      - label: Follow official instructions to leave or stay inside
        note: true
        body: >
          For an outdoor release, officials may tell you to close windows and
          ventilation.
      - label: >
          Trouble breathing, collapse, a gas smell, or an active dangerous
          release?
        note: true
        body: Move to safety and call 911.

  - id: preparedness
    title: Get Ready
    items:
      - label: Follow chemical spill safety guidance
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/hazardous-materials-chemical-spills-radiation.page
        body: >
          Moving away, sheltering, and following official instructions during
          a hazardous release.
      - label: Get local emergency alerts
        link_label: Notify NYC
        url: https://a858-nycnotify.nyc.gov/notifynyc/
        body: >
          Free alerts by app, text, email, or phone. Select basement alerts if
          needed. Multilingual alerts and ASL videos.
      - label: Know when to leave or stay inside
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/get-prepared.page
        body: >
          Evacuation and shelter-in-place guidance. Follow instructions for
          the specific emergency.

  - id: response
    title: When Something Happens
    items:
      - label: Call NYC Poison Control
        link_label: NYC311
        url: https://portal.311.nyc.gov/article/?kanumber=KA-01888
        body: >
          Free, confidential advice for a possible exposure. Call
          212-764-7667 immediately; do not wait for symptoms. 24/7 phone
          interpreters in 150 languages.
      - label: Report a gas emergency
        link_label: National Grid
        url: https://www.nationalgridus.com/NY-Home/Contact-Us/
        body: >
          Gas service in most of Queens: 718-643-4050. For a gas smell, leave
          first and call 911 from outside.
      - label: Report a gas emergency in the Rockaways
        link_label: National Grid Long Island
        url: https://www.nationalgridus.com/Long-Island-NY-Home/Contact-Us/
        body: >
          Gas service in the Rockaways: 800-490-0045. National Grid supplies
          gas, not electricity. For a gas smell, leave first and call 911
          from outside.

map_layers: []
