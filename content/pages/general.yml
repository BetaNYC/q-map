# General Resources
# Authored content: the pipeline validates and copies it to
# data/processed/pages/general.json.
#
# From the SME partners' final "Core Readiness Messages by Threat"
# (test/Core Readiness Messages by Threat.pdf, delivered 2026-10-26), its
# "General" section, using the mapping documented in
# content/hazards/flooding.yml. That document adds three link groups to the
# two this page had: After Something Happened, For Health Needs, and For Food,
# Financial & Legal Support.
#
# "Get emergency alerts for those with disabilities" has no colon in the PDF
# ("NYC Advance Warning System sends text alerts for ..."); the system's name
# is `link_label` and the rest is `body`.

slug: general
label: General Resources

summary: >
  A few steps can help in any emergency. Sign up for local alerts, choose
  someone to check in with, and plan where you could go. Keep medicines, a
  flashlight, a charger, and important contacts ready. Include children,
  pets, and anyone who may need help in your plan. Gather supplies over time,
  starting with what you already have.


  Call 911 for immediate danger. For City services or help finding resources,
  call 311 and ask for an interpreter.

sections:
  - id: preparedness
    title: Get Ready
    items:
      - label: Get local emergency alerts
        link_label: Notify NYC
        url: https://a858-nycnotify.nyc.gov/notifynyc/
        body: >
          Free alerts by app, text, email, or phone. Select basement alerts if
          needed. Multilingual alerts and ASL videos.
      - label: Make your household emergency plan
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/guides-resources.page
        body: >
          Choose contacts, meeting places, medications, and support for
          leaving or staying home. Translated workbooks and audio versions.
      - label: Plan for disability and medical needs
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/disabilities-access-functional-needs.page
        body: >
          Support networks, communication, transportation, and powered medical
          equipment.
      - label: Plan for pets and service animals
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/pets.page
        body: >
          Supplies and evacuation. City disaster evacuation centers accept
          pets and service animals.
      - label: Pack a Go Bag and home supplies
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/gather-supplies.page
        body: >
          Practical supply lists. Build your kit over time, starting with what
          you have.
      - label: Prepare your small business
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/businesses.page
        body: Business continuity planning and preparedness guides.

  - id: response
    title: When Something Happens
    items:
      - label: Ask NYC311 for help
        link_label: NYC311
        url: https://portal.311.nyc.gov/
        body: >
          Find City services, report problems, or ask what is open. Call 311;
          outside NYC, 212-639-9675. Phone interpreters in more than 175
          languages.
      - label: Know when to leave or stay inside
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/ready/get-prepared.page
        body: >
          Evacuation and shelter-in-place guidance. Follow instructions for
          the specific emergency.
      - label: Talk to someone about stress or distress
        link_label: NYC 988
        url: https://www.nyc.gov/site/doh/health/health-topics/988.page
        body: >
          Free, confidential mental health support, 24/7. Call or text 988.
          Phone support in 200+ languages; text and chat in English and
          Spanish.
      - label: Get emergency alerts for those with disabilities
        link_label: NYC Advance Warning System
        url: https://www.advancewarningsystemnyc.org/aws/
        body: >
          Sends text alerts for organizations that serve people with
          disabilities and others with access and functional needs.

  - id: after
    title: After Something Happened
    items:
      - label: Get help if you cannot return home
        link_label: Back Home NYC
        url: https://backhome.nyc.gov/
        body: >
          Help for tenants displaced by emergencies or vacate orders. Call
          212-389-6670.
      - label: Get help after a disaster
        link_label: American Red Cross Greater New York
        url: https://www.redcross.org/local/new-york/greater-new-york/get-help.html
        body: >
          Disaster assistance and recovery referrals. Call 877-733-2767;
          support depends on the incident.
      - label: Find current disaster recovery resources
        link_label: NYC Emergency Management
        url: https://www.nyc.gov/site/em/resources/for-individuals.page
        body: >
          Cleanup, housing, financial help, and recovery referrals. Available
          aid varies by event.

  - id: health
    title: For Health Needs
    items:
      - label: Find a City hospital or health center
        link_label: NYC Health + Hospitals
        url: https://www.nychealthandhospitals.org/get-care/
        body: >
          Care locations, appointments, and financial assistance for insured
          and uninsured patients. Includes Elmhurst and Queens hospitals.
      - label: Get healthcare if you are uninsured
        link_label: NYC Care
        url: https://www.nyccare.nyc/enroll/
        body: >
          Affordable care through NYC Health + Hospitals for eligible NYC
          residents. Call 646-692-2273; immigration status is no barrier.
          Interpreters and translated materials.
      - label: Find support for an older adult
        link_label: NYC Aging
        url: https://www.nyc.gov/site/dfta/services/find-help.page
        body: >
          Meals, case management, caregiver help, and local centers. Call
          Aging Connect at 212-244-6469. Phone language assistance available.
      - label: Get disability support in Queens
        link_label: CIDNY
        url: https://www.cidny.org/hours/
        body: >
          Benefits, healthcare, transportation, and independent-living
          referrals. Queens intake: 646-849-8096. Not an emergency dispatch
          service. ASL staff available.

  - id: food-financial-legal
    title: For Food, Financial & Legal Support
    items:
      - label: Find a food pantry or free meal
        link_label: Food Help NYC
        url: https://finder.nyc.gov/foodhelp/locations
        body: >
          Locate nearby pantries and community kitchens. Confirm hours before
          traveling; call 311 for help.
      - label: Find benefits and financial help
        link_label: ACCESS NYC
        url: https://access.nyc.gov/
        body: >
          Check eligibility for City and state programs. Program rules and
          application periods vary. Translated program information.
      - label: Ask about emergency financial assistance
        link_label: HRA One Shot Deal
        url: https://access.nyc.gov/programs/one-shot-deal/
        body: >
          Possible help with an emergency, rent, or utility bills. Eligibility
          applies; some assistance requires repayment.
      - label: Get help keeping your housing
        link_label: HRA Homebase
        url: https://www.nyc.gov/site/hra/help/homebase.page
        body: >
          Services for eligible households at risk of entering shelter. Find
          the provider serving your ZIP code.
      - label: Get free legal help in Queens
        link_label: Queens Legal Services
        url: https://www.legalservicesnyc.org/boroughs/queens-legal-services/
        body: >
          Civil legal help for low-income residents, including housing and
          benefits. Intake: 917-661-4500, weekdays from 9:30 AM to 4:00 PM.
