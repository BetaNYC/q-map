name: pipeline

# The tag of the data-v* release holding the Tier-2 mirrors lives in the
# DATA_VERSION file, read below. d26 hardcoded its tag in two workflows and had
# to edit both on every re-cut; one place only.

on:
  push:
    branches: [main]
    # The pipeline auto-commits data/processed/. paths-ignore stops that commit
    # from re-triggering this workflow. Pushes made with GITHUB_TOKEN do not
    # re-trigger workflows either, so this is the second of two guards.
    paths-ignore:
      - 'data/processed/**'
  schedule:
    # Monday 07:00 UTC. Tier-1 sources move slowly; this is a freshness check
    # rather than a real refresh cadence.
    - cron: '0 7 * * 1'
  repository_dispatch:
    types: [respiratory-archive-updated]
  workflow_dispatch:

permissions:
  contents: write   # auto-commit data/processed/
  pages: write      # deploy-pages
  id-token: write   # OIDC auth for the Pages deploy

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      # On a push, only run the pipeline when something it depends on changed.
      # On every other event the filter step is skipped and the output is empty,
      # which the `if` below treats as "run". d26 shipped without this gate and
      # documented "every frontend change re-runs the entire pipeline" as a
      # known wart before retrofitting it; take the end state.
      #
      # `web/**` is deliberately ABSENT from this list. A frontend-only push
      # must not re-run {targets}; it falls through to build-web, which deploys
      # against the committed data/processed/. Do not add it.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            data:
              - 'R/**'
              - '_targets.R'
              - 'scripts/**'
              - 'content/**'
              - 'data/crosswalk/**'
              - 'data/registry/**'
              - 'data/canonical/**'
              - 'data/archive/**'
              - 'uvr.lock'
              - 'DATA_VERSION'
              - '.github/workflows/pipeline.yml'

  pipeline:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the data release tag
        id: dv
        run: echo "tag=$(cat DATA_VERSION)" >> "$GITHUB_OUTPUT"

      # No container. The Dockerfile d26 used existed to build GDAL from source
      # with the Parquet driver, which PIPELINE_DESIGN.md section 3 declined -
      # q-map ships JSON. uvr.lock pins R and every package with checksums,
      # which is stronger pinning than that image provided. See section 10.
      #
      # libnode-dev is for V8, which rmapshaper needs and which is the one
      # dependency here that fails in a way that looks unrelated to mapping.
      # System libraries the P3M binaries link against but do not carry.
      #
      # uvr.lock pins every R package and its checksum, which is a stronger
      # guarantee than the Dockerfile it replaced - but it says nothing about
      # the C libraries those binaries were compiled against. That gap is
      # invisible until a shared object fails to load at runtime.
      #
      #   libgdal/geos/proj/udunits2   sf, units, classInt
      #   libnode                      V8, which rmapshaper needs
      #   libglpk, libgmp              igraph, which `targets` imports
      #
      # The igraph pair was missing and broke the first CI run:
      #   libglpk.so.40: cannot open shared object file
      # libgmp is added alongside it because igraph links both and the second
      # would surface as an identical failure on the next run.
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libnode-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglpk-dev libgmp-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'   # must match the [r] version in uvr.lock
          use-public-rspm: true

      - name: Install uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache the uvr library
        uses: actions/cache@v4
        with:
          path: .uvr/library
          key: uvr-${{ runner.os }}-${{ hashFiles('uvr.lock') }}

      # PIPELINE_DESIGN.md section 10: do NOT inherit d26's cold cache. Every
      # d26 run is a full rebuild, which is fine at its scale and painful at a
      # citywide one. The rolling key always saves a fresh cache and restores
      # the most recent; targets decides what is actually stale.
      - name: Cache the targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ runner.os }}-${{ github.run_id }}
          restore-keys: targets-${{ runner.os }}-

      - name: Restore the locked library
        run: uvr sync --frozen   # fails if uvr.lock is stale

      - name: Rehydrate Tier-2 mirrors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/prepared
          gh release download "${{ steps.dv.outputs.tag }}" \
            --repo "${{ github.repository }}" --dir data/prepared/ --clobber

      - name: Run the pipeline
        env:
          # R reads only the FIRST .Renviron it finds, and this project has its
          # own (gitignored, so absent here). Keys must arrive as environment
          # variables; census_api_key() checks Sys.getenv first.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uvr run scripts/run_pipeline.R

      - name: Commit refreshed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --staged --quiet; then
            echo "No change to data/processed"
          else
            git commit -m "chore(pipeline): refresh outputs"
            git push
          fi

      # Hand the freshly built outputs to build-web. Not the Pages artifact -
      # that is web/build. build-web checks out the triggering SHA, which
      # predates the auto-commit above, so its own data/processed/ would be a
      # run behind. This is the only way the site and its data ship together.
      - name: Upload processed outputs
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/

  # Build the Svelte app and bundle it with the data. Plain runner, Node only -
  # none of the geospatial toolchain above is needed here.
  #
  # This job lives in pipeline.yml rather than a workflow of its own because the
  # `paths-ignore: data/processed/**` guard at the top sits on the TRIGGER, so
  # any job added here inherits it. A separate pages.yml would not, and the
  # auto-commit would set a data refresh and a site rebuild chasing each other.
  build-web:
    needs: pipeline
    # Run whether the pipeline ran or was skipped, but not if it failed or was
    # cancelled - a failed pipeline leaves the previous Pages deploy live rather
    # than publishing against half-written outputs.
    if: always() && needs.pipeline.result != 'failure' && needs.pipeline.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # web/static/data is a symlink for local dev. CI replaces it with a real
      # directory, so no deploy ever depends on symlink traversal.
      - name: Remove the dev data symlink
        run: rm -f web/static/data

      # The pipeline ran this run: use its artifact, which is newer than
      # anything in this job's checkout.
      - name: Use the freshly built outputs
        if: needs.pipeline.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: web/static/data

      # The pipeline was skipped (a web- or docs-only push): build against the
      # committed snapshot, which is current by definition.
      - name: Use the committed outputs
        if: needs.pipeline.result == 'skipped'
        run: cp -R data/processed web/static/data

      - name: Prune junk
        run: find web/static/data -name '.DS_Store' -delete

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          # Cache-buster for the data URLs. The deploy SHA, because it changes
          # whenever the deployed data changes - unlike DATA_VERSION, which
          # names the Tier-2 *input* mirror release. See web/src/lib/data.ts.
          VITE_DATA_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build-web
    # build-web runs even when pipeline is skipped, but a skipped upstream job
    # otherwise propagates a skip down to here. Opt out of that propagation so
    # the site publishes whenever the web build succeeded, pipeline or not.
    if: ${{ !cancelled() && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
